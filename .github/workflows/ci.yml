name: BuildingEdge quality gate
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cpp-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure with AddressSanitizer and UBSan
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DBMS_SANITIZE=ON
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
  rust-and-crosslanguage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path rust/Cargo.toml --check
      - run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path rust/Cargo.toml --locked
      - run: cargo build --manifest-path rust/Cargo.toml --locked
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build --parallel 2
      - run: mkdir -p output
      - run: python3 scripts/integration.py --mode python
      - run: python3 scripts/integration.py --mode rust
      - run: python3 scripts/system_tests.py
      - run: python3 scripts/fault_tests.py
  rust-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path rust/Cargo.toml --locked
      - run: cargo build --manifest-path rust/Cargo.toml --locked
      - run: python scripts/system_tests.py
